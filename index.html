<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="盘感练习">
  <meta name="theme-color" content="#0d0d0d">
  <title>盘感练习</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">盘感练习</span>
      <span class="badge" id="symbolBadge">日线 / 小时</span>
    </div>
    <button class="btn" id="themeBtn" type="button">浅色</button>
  </header>

  <section id="homeView" class="view">
    <div class="card" id="resumeCard" hidden>
      <h3>上次练习还没结束</h3>
      <p class="hint" id="resumeInfo"></p>
      <button class="btn primary" id="resumeBtn" type="button">继续上次练习</button>
      <button class="btn" id="discardResumeBtn" type="button">删除这局进度</button>
    </div>
    <div class="card">
      <h3>开始一局</h3>
      <label>品种
        <select id="trSymSel"><option value="">随机</option></select>
      </label>
      <label>市场
        <select id="trMktSel">
          <option value="">随机</option>
          <option value="加密">加密</option>
          <option value="美股">美股</option>
          <option value="A股">A股</option>
          <option value="港股">港股</option>
          <option value="贵金属">贵金属</option>
        </select>
      </label>
      <label>级别
        <select id="trTfSel">
          <option value="">随机</option>
          <option value="1D">1D 日线</option>
          <option value="4H">4H</option>
          <option value="1H">1H 小时</option>
        </select>
      </label>
      <p class="hint">4H / 1H 目前仅加密品种有数据。</p>
      <label>步数
        <input id="trStepsInput" type="number" inputmode="numeric" value="200" min="20" max="500">
      </label>
      <button class="btn primary" id="trainerBtn" type="button">开始练习</button>
    </div>

    <div class="card">
      <h3>离线数据</h3>
      <p class="hint" id="offlineStatus">首次使用需联网下载品种 K 线；下完后可断网练习。</p>
      <label>下载范围<select id="offlineMarket"><option value="">全部市场</option><option>加密</option><option>美股</option><option>A股</option><option>港股</option><option>贵金属</option></select></label>
      <div class="row-btns offline-actions">
        <button class="btn" id="prefetchBtn" type="button">下载未缓存品种</button>
        <button class="btn" id="cancelDownload" type="button" hidden>取消下载</button>
        <button class="btn" id="retryDownload" type="button" hidden>重试失败项</button>
      </div>
      <progress id="downloadProgress" value="0" max="1" hidden aria-label="下载进度"></progress>
      <p class="hint" id="downloadStatus" role="status"></p>
      <details><summary>查看各品种离线状态</summary><div id="offlineList"></div></details>
    </div>

    <div class="card">
      <h3>练习战绩 <span id="trStatMode"></span></h3>
      <div class="trade-stats" id="trStatsGrid"></div>
      <div id="trPerSym" class="per-sym"></div>
      <div id="logicStats" class="per-sym"></div>
      <div class="row-btns">
        <button class="btn primary" id="trExport" type="button">导出全部练习明细 CSV</button>
        <button class="btn" id="trStatsClear" type="button">清零战绩</button>
      </div>
      <div class="subhead">历史练习（点开逐笔）</div>
      <div id="trHistory"></div>
      <button class="btn" id="historyMore" type="button" hidden>加载更多历史</button>
    </div>
  </section>

  <section id="practiceView" class="view" hidden>
    <div class="chart-toolbar">
      <div class="legend">
        <span class="legend-symbol">???</span>
        <span class="legend-date" id="legendDate">—</span>
        <span class="legend-ohlc" id="legendOhlc">—</span>
        <span class="legend-chg" id="legendChg"></span>
        <span class="legend-dist" id="legendDist"></span>
      </div>
      <button class="btn" id="chartSettingsBtn" type="button" aria-expanded="false" aria-controls="chartSettings">图表工具</button>
    </div>
    <div id="chartSettings" hidden>
      <div class="chart-tools-right">
        <label class="ma-lab">MA
          <input id="maPeriods" type="text" inputmode="text" enterkeyhint="done" autocapitalize="off" autocomplete="off" value="20,60,120">
        </label>
        <button class="btn ma-comma" id="maComma" type="button" title="插入逗号">,</button>
        <div class="seg" id="overlayToggle">
          <button type="button" data-ov="ma" class="active">MA</button>
          <button type="button" data-ov="macd" class="active">MACD</button>
          <button type="button" data-ov="vol" class="active">量</button>
        </div>
      </div>
    <div class="chart-toolbar draw-bar">
      <div class="seg" id="drawToggle">
        <button type="button" data-tool="none" class="active">画线关</button>
        <button type="button" data-tool="trend">趋势线</button>
        <button type="button" data-tool="sandr">水平线</button>
      </div>
      <button class="btn" id="drawClear" type="button">清线</button>
      <span id="drawHint" class="draw-hint"></span>
    </div>
    </div>
    <div class="chart-box">
      <div id="chart"></div>
      <div id="volume"></div>
      <div id="macd"></div>
      <div id="trainerBanner"></div>
    </div>

    <button id="positionSummary" type="button" class="position-summary" aria-label="查看持仓与账户"></button>
    <div id="reviewNav" hidden>
      <button class="btn" id="reviewPrev" type="button">上一笔</button>
      <span id="reviewLabel"></span>
      <button class="btn" id="reviewNext" type="button">下一笔</button>
    </div>

    <div id="tradeSheet" class="trade-sheet" hidden>
      <div class="sheet-backdrop" id="tradeSheetBackdrop"></div>
      <div class="sheet-panel" role="region" aria-label="本局交易">
        <div class="sheet-grab">
          <span class="grab-bar"></span>
          <button class="btn" id="tradeSheetClose" type="button">收回</button>
        </div>
        <div class="trade-dock" id="tradeDock">
      <h3>本局交易 <span id="journalMode"></span></h3>
      <div id="jPositions"></div>
      <details id="newOrderDetails" open>
      <summary>新开仓</summary>
      <div id="journalForm" class="journal-form">
        <div class="grid3">
          <label>保证金U<input id="jCapital" type="number" inputmode="decimal" value="100000" min="1"></label>
          <label>杠杆<input id="jLeverage" type="number" inputmode="numeric" value="10" min="1" max="125"></label>
          <label>方向<select id="jSide"><option value="多">做多</option><option value="空">做空</option></select></label>
        </div>
        <div class="grid2">
          <label>开仓价<input id="jEntry" type="number" inputmode="decimal" placeholder="空=收盘"></label>
          <label>止损价<input id="jStop" type="number" inputmode="decimal" placeholder="可选"></label>
        </div>
        <div class="logic-picks" id="jLogicPicks">
          <div class="logic-label">开单逻辑（可多选，可不选）</div>
          <div class="chips">
            <button type="button" class="chip" data-logic="MACD背离">MACD背离</button>
            <button type="button" class="chip" data-logic="均线突破">均线突破</button>
            <button type="button" class="chip" data-logic="均线回踩">均线回踩</button>
            <button type="button" class="chip" data-logic="裸K">裸K</button>
            <button type="button" class="chip" data-logic="趋势线突破">趋势线突破</button>
            <button type="button" class="chip" data-logic="成交量放大">成交量放大</button>
          </div>
        </div>
        <button class="btn primary" id="jOpen" type="button">开单（当前K线）</button>
      </div>
      </details>
        </div>
      </div>
    </div>

    <div class="trainer-bar" id="trainerCtl">
      <span class="progress" id="trainerProgress">0/200</span>
      <button class="btn" id="tradeToggle" type="button">交易</button>
      <button class="btn primary" id="trainerNext" type="button">下一根</button>
      <button class="btn" id="trainerQuit" type="button">放弃</button>
      <button class="btn" id="trainerEnd" type="button" hidden>结束</button>
      <button class="btn primary" id="trainerAgain" type="button" hidden>再来一局</button>
    </div>
  </section>
</div>

<div id="loading" hidden><span>加载中…</span></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="js/core.js"></script>
<script src="js/persist.js"></script>
<script src="js/charts.js"></script>
<script src="js/journal.js"></script>
<script src="js/trainer.js"></script>
<script src="js/experience.js"></script>
<script src="js/offline.js"></script>
<script src="js/main.js"></script>
</body>
</html>
